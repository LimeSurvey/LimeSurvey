name: Codespell - Spelling Check

# Run on PRs against the long-lived branches and on direct pushes to them.
on:
  pull_request:
    branches:
      - master
      - develop-major
      - develop-minor
  push:
    branches:
      - master
      - develop-major
      - develop-minor

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-22.04
    name: Check for spelling errors
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          # The action always passes --skip (default './.git'), which overrides
          # the skip list in .codespellrc, so it has to be repeated here.
          skip: vendor,node_modules,./.git,*.min.js,*.min.css,build,dist,./upload,.gitignore,.DS_Store,*.lock,*.lss,./assets/packages,./application/extensions/yiiwheels,./application/extensions/yii-jsoneditor,./application/extensions/captchaExtended,./docs/swagger/swagger-ui*
