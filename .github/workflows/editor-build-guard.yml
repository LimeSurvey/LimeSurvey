# Fails PRs that commit editor build output; editor-build.yml rebuilds it after merge.
name: QuestionEditor - No build output in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Guard:
    name: No editor build files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail if PR contains editor build output
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE...$HEAD" -- editor/build editor/index.html)

          if [ -n "$files" ]; then
            echo "::error::Don't commit editor build output; CI rebuilds it after merge. Drop these changes:"
            echo "$files"
            exit 1
          fi
