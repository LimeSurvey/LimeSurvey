# Rebuilds the static editor and commits changed output.
name: QuestionEditor - Rebuild

on:
  push:
    branches:
      - master
      - develop-major
      - develop-minor
    paths:
      - 'editor/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-editor-build
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./editor

jobs:
  Build:
    name: Build and commit editor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Capture source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build editor
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PUBLIC_URL: build
        run: npm run build

      - name: Commit and push changes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          git add -A -- build index.html

          if git diff --cached --quiet; then
            echo "Editor build is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Dev: Rebuilt editor from ${SOURCE_COMMIT}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
