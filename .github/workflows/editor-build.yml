# Rebuilds the static editor and commits changed output.
name: QuestionEditor - Rebuild

on:
  push:
    branches:
      - master
      - develop-major
      - develop-minor
      - feature/react-editor-build # temporary
    paths:
      - 'editor/**'
      - '!editor/build/**'
      - '!editor/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-editor-build
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./editor

jobs:
  Build:
    name: Build and commit editor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Capture source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for pushed build files
        id: check
        if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --depth=1 origin "$BEFORE"

          if git diff --name-only "$BEFORE" HEAD -- build index.html | grep -q .; then
            echo "::notice::Push already contains editor build files, skipping rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Build editor
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PUBLIC_URL: build
        run: npm run build

      - name: Commit and push changes
        if: steps.check.outputs.skip != 'true'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          git add -A -- build index.html

          if git diff --cached --quiet; then
            echo "Editor build is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Dev: Rebuilt editor from ${SOURCE_COMMIT}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
